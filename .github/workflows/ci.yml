name: CI

# The collector scripts are platform-specific and cannot all be exercised on one
# machine, so the matrix IS the verification: ubuntu-latest runs the Linux
# collector, macos-latest the macOS one, windows-latest the Windows one.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # `prepare` rebuilds lib/ during install.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test (includes this runner's collector, run for real)
        run: pnpm run test

      - name: Build
        run: pnpm run build

      # lib/ is committed so a GitHub install works without a build step.
      # If this fails, the committed artifacts drifted from the source.
      - name: Verify committed lib/ matches a clean build
        run: git diff --exit-code -- lib
        shell: bash
